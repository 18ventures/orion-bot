<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071019"><title>Orion</title>
<style>
body{margin:0;background:#071019;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;padding:24px 16px 80px}.logo{text-align:center;font-weight:850;letter-spacing:.14em;font-size:23px;padding:10px 0 24px}.balance{text-align:center}.eyebrow,.row span,.status,.empty{color:#8b9aa8}.balance h1{font-size:43px;margin:7px 0}.green{color:#35e58a;font-weight:700}.card,.stat,.input{background:#0d1924;border:1px solid #1c2b38;border-radius:16px}.card{padding:17px;margin-top:20px}.head{display:flex;justify-content:space-between;font-weight:750}.pill{font-size:11px;padding:6px 9px;border-radius:8px}.short{background:#341b22;color:#ff626a}.long{background:#113124;color:#35e58a}.row{display:flex;justify-content:space-between;padding:9px 0;font-size:14px}.section{font-size:17px;font-weight:780;margin:25px 2px 10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:13px 10px}.stat small{display:block;color:#8b9aa8;font-size:11px;margin-bottom:7px}.login{max-width:380px;margin-top:55px}.login p{text-align:center;color:#8b9aa8;font-size:13px}.input{width:100%;padding:13px;margin:6px 0;color:#fff;box-sizing:border-box}.button{width:100%;padding:13px;border:0;border-radius:12px;background:#172635;color:#fff;font-weight:750;margin-top:8px}.error{color:#ff626a;text-align:center;font-size:13px;margin-top:10px}.hidden{display:none}.empty{text-align:center;padding:18px}.status{text-align:center;font-size:11px;margin-top:18px}
</style></head><body>
<div id="login" class="app login"><div class="logo">ORION</div><p>Client dashboard access</p><input id="secret" class="input" type="password" placeholder="Dashboard access key"><input id="client" class="input" value="1" placeholder="Client ID"><button class="button" onclick="connect()">Open Dashboard</button><div id="err" class="error"></div></div>
<main id="dash" class="app hidden"><div class="logo">ORION</div><div class="balance"><div class="eyebrow">Total Balance</div><h1 id="balance">—</h1><div class="green" id="pnl">—</div></div>
<section id="pos" class="card hidden"><div class="head"><span>Open Position</span><span id="side" class="pill">—</span></div><div class="row"><span>BTC Perpetual</span><b id="size">—</b></div><div class="row"><span>Entry Price</span><b id="entry">—</b></div><div class="row"><span>Mark Price</span><b id="mark">—</b></div><div class="row"><span>Unrealised P&amp;L</span><b class="green" id="unreal">—</b></div></section>
<section id="none" class="card empty">No open position</section><div class="section">Today</div><div class="stats"><div class="stat"><small>Trades</small><b id="trades">—</b></div><div class="stat"><small>Wins</small><b id="wins">—</b></div><div class="stat"><small>Win Rate</small><b id="wr">—</b></div></div><div class="status" id="status">Connected</div></main>
<script>
let API="",SECRET="",CLIENT="1";const money=n=>"$"+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
async function connect(){API=window.location.origin;SECRET=secret.value;CLIENT=client.value.trim()||"1";if(!API||!SECRET){err.textContent="Enter the Railway URL and access key.";return}await load(true)}
async function load(first=false){try{let r=await fetch(API+"/api/client/dashboard?client_id="+encodeURIComponent(CLIENT),{headers:{"X-Secret":SECRET}}),d=await r.json();if(!r.ok)throw Error(d.error||"Connection failed");balance.textContent=money(d.balance);trades.textContent=d.today.trades;wins.textContent=d.today.wins;wr.textContent=Number(d.today.win_rate).toFixed(0)+"%";let p=d.position;if(p){pos.classList.remove("hidden");none.classList.add("hidden");side.textContent=p.side;side.className="pill "+(p.side==="LONG"?"long":"short");size.textContent=Number(p.size).toFixed(5)+" BTC";entry.textContent=money(p.entry_price);mark.textContent=money(p.mark_price);unreal.textContent=(p.unrealized_pnl>=0?"+":"")+money(p.unrealized_pnl)+" ("+Number(p.unrealized_pnl_pct).toFixed(2)+"%)";pnl.textContent=(p.unrealized_pnl>=0?"+":"")+money(p.unrealized_pnl)+" unrealised"}else{pos.classList.add("hidden");none.classList.remove("hidden");pnl.textContent="No open position"}status.textContent="Connected · updated just now";if(first){login.classList.add("hidden");dash.classList.remove("hidden")}}catch(e){if(first)err.textContent=e.message;else status.textContent="Connection unavailable"}}
setInterval(()=>{if(!dash.classList.contains("hidden"))load()},30000);
</script></body></html>
