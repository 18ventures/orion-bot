<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071019"><title>Orion</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orion">
<style>
body{margin:0;background:#071019;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;padding:24px 16px 80px}.logo{text-align:center;font-weight:850;letter-spacing:.14em;font-size:23px;padding:10px 0 24px}.balance{text-align:center}.eyebrow,.row span,.status,.empty{color:#8b9aa8}.balance h1{font-size:43px;margin:7px 0}.green{color:#35e58a;font-weight:700}.red{color:#ff626a;font-weight:700}.card,.stat{background:#0d1924;border:1px solid #1c2b38;border-radius:16px}.card{padding:17px;margin-top:20px}.head{display:flex;justify-content:space-between;font-weight:750}.pill{font-size:11px;padding:6px 9px;border-radius:8px}.short{background:#341b22;color:#ff626a}.long{background:#113124;color:#35e58a}.row{display:flex;justify-content:space-between;padding:9px 0;font-size:14px}.section{font-size:17px;font-weight:780;margin:25px 2px 10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:13px 10px}.stat small{display:block;color:#8b9aa8;font-size:11px;margin-bottom:7px}.notice{max-width:380px;margin-top:55px;text-align:center}.notice p{color:#8b9aa8;font-size:13px;line-height:1.5}.error{color:#ff626a;text-align:center;font-size:13px;margin-top:10px}.hidden{display:none}.empty{text-align:center;padding:18px}.status{text-align:center;font-size:11px;margin-top:18px}
</style></head><body>
<div id="notice" class="app notice hidden"><div class="logo">ORION</div><p id="noticeText">This link isn't valid. Ask Nathan for your personal dashboard link.</p></div>
<main id="dash" class="app hidden"><div class="logo">ORION</div><div class="balance"><div class="eyebrow">Total Balance</div><h1 id="balance">—</h1><div id="pnl">—</div></div>
<section id="pos" class="card hidden"><div class="head"><span>Open Position</span><span id="side" class="pill">—</span></div><div class="row"><span>BTC Perpetual</span><b id="size">—</b></div><div class="row"><span>Entry Price</span><b id="entry">—</b></div><div class="row"><span>Mark Price</span><b id="mark">—</b></div><div class="row"><span>Unrealised P&amp;L</span><b id="unreal">—</b></div></section>
<section id="none" class="card empty">No open position</section><div class="section">Today</div><div class="stats"><div class="stat"><small>Trades</small><b id="trades">—</b></div><div class="stat"><small>Wins</small><b id="wins">—</b></div><div class="stat"><small>Win Rate</small><b id="wr">—</b></div></div>
<div id="clientsSection" class="hidden"><div class="section">Clients</div><div id="clientsList" class="card"></div></div>
<div id="historySection" class="hidden"><div class="section">Last 7 Days</div><div id="historyTotals" class="card"></div><div id="historyList" class="card" style="margin-top:10px"></div></div>
<div class="status" id="status">Connecting…</div></main>
<script>
// Each client gets a personal link like https://your-app.up.railway.app/?t=THEIR_TOKEN
// There is no password field and no client-typed ID: the token in the URL IS the
// credential, and the server maps it server-side to exactly one account. This means
// one client's link can never be edited to view another client's data.
const TOKEN = new URLSearchParams(window.location.search).get("t");
const money = n => "$" + Number(n).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

function showNotice(msg) {
  document.getElementById("noticeText").textContent = msg;
  notice.classList.remove("hidden");
  dash.classList.add("hidden");
}

async function load(first = false) {
  try {
    let r = await fetch(window.location.origin + "/api/client/dashboard?t=" + encodeURIComponent(TOKEN));
    let d = await r.json();
    if (!r.ok) throw Error(d.error || "Connection failed");

    balance.textContent = money(d.balance);
    trades.textContent = d.today.trades;
    wins.textContent = d.today.wins;
    wr.textContent = Number(d.today.win_rate).toFixed(0) + "%";

    let p = d.position;
    if (p) {
      pos.classList.remove("hidden");
      none.classList.add("hidden");
      side.textContent = p.side;
      side.className = "pill " + (p.side === "LONG" ? "long" : "short");
      size.textContent = Number(p.size).toFixed(5) + " BTC";
      entry.textContent = money(p.entry_price);
      mark.textContent = money(p.mark_price);
      const pnlClass = p.unrealized_pnl >= 0 ? "green" : "red";
      unreal.className = pnlClass;
      unreal.textContent = (p.unrealized_pnl >= 0 ? "+" : "") + money(p.unrealized_pnl) + " (" + Number(p.unrealized_pnl_pct).toFixed(2) + "%)";
      pnl.className = pnlClass;
      pnl.textContent = (p.unrealized_pnl >= 0 ? "+" : "") + money(p.unrealized_pnl) + " unrealised";
    } else {
      pos.classList.add("hidden");
      none.classList.remove("hidden");
      pnl.className = "";
      pnl.textContent = "No open position";
    }
    status.textContent = "Connected · updated just now";
    if (first) {
      notice.classList.add("hidden");
      dash.classList.remove("hidden");
      loadHistory(); // once per page load — history doesn't need 30s polling
    }
    if (d.client_id === "1") loadClients();
  } catch (e) {
    if (first) showNotice(e.message);
    else status.textContent = "Connection unavailable";
  }
}

function renderClients(rows) {
  clientsList.innerHTML = rows.map((c, i) => {
    const divider = i > 0 ? "border-top:1px solid #1c2b38;" : "";
    const copyBtn = c.dashboard_url
      ? ` <button onclick="navigator.clipboard.writeText('${c.dashboard_url}');this.textContent='Copied';setTimeout(()=>this.textContent='Copy link',1200)" style="background:#172635;color:#8b9aa8;border:0;border-radius:6px;padding:4px 8px;font-size:10px;margin-left:8px;cursor:pointer">Copy link</button>`
      : "";
    if (c.status === "not_linked") {
      return `<div class="row" style="${divider}"><span>Client ${c.client_id}</span><span style="color:#8b9aa8">Not linked${copyBtn}</span></div>`;
    }
    if (c.status === "error") {
      return `<div class="row" style="${divider}"><span>Client ${c.client_id}</span><span style="color:#ff626a">Unavailable${copyBtn}</span></div>`;
    }
    let extra = "";
    if (c.position) {
      const cls = c.position.unrealized_pnl >= 0 ? "green" : "red";
      const sign = c.position.unrealized_pnl >= 0 ? "+" : "";
      extra = ` <span class="${cls}" style="font-size:12px">(${c.position.side} ${sign}${money(c.position.unrealized_pnl)})</span>`;
    }
    return `<div class="row" style="${divider}"><span>Client ${c.client_id}</span><span><b>${money(c.balance)}</b>${extra}${copyBtn}</span></div>`;
  }).join("");
}

async function loadClients() {
  try {
    let r = await fetch(window.location.origin + "/api/admin/clients?t=" + encodeURIComponent(TOKEN));
    let d = await r.json();
    if (!r.ok) return; // silently skip — not the master token, or a transient error
    clientsSection.classList.remove("hidden");
    renderClients(d.clients);
  } catch (e) { /* non-fatal — this panel is a bonus, not core to the dashboard */ }
}

function formatDateLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
}

function renderHistory(data) {
  const t = data.period_totals;
  const totalCls = t.pnl >= 0 ? "green" : "red";
  historyTotals.innerHTML =
    `<div class="row"><span>${data.days.length}-day total</span><span>${t.trades} trades · ${t.win_rate.toFixed(0)}% win rate</span></div>` +
    `<div class="row" style="border-top:1px solid #1c2b38"><span>Net P&L</span><span class="${totalCls}"><b>${(t.pnl >= 0 ? "+" : "") + money(t.pnl)}</b></span></div>`;

  historyList.innerHTML = data.days.map((d, i) => {
    const divider = i > 0 ? "border-top:1px solid #1c2b38;" : "";
    if (d.trades === 0) {
      return `<div class="row" style="${divider}"><span>${formatDateLabel(d.date)}</span><span style="color:#8b9aa8">No trades</span></div>`;
    }
    const cls = d.pnl >= 0 ? "green" : "red";
    return `<div class="row" style="${divider}"><span>${formatDateLabel(d.date)}</span><span><span class="${cls}"><b>${(d.pnl >= 0 ? "+" : "") + money(d.pnl)}</b></span> <span style="color:#8b9aa8;font-size:12px">${d.trades} trades · ${d.win_rate.toFixed(0)}%</span></span></div>`;
  }).join("");
}

async function loadHistory() {
  try {
    let r = await fetch(window.location.origin + "/api/client/history?t=" + encodeURIComponent(TOKEN));
    let d = await r.json();
    if (!r.ok) return;
    historySection.classList.remove("hidden");
    renderHistory(d);
  } catch (e) { /* non-fatal — history is supplementary, dashboard still works without it */ }
}

if (!TOKEN) {
  showNotice("This link isn't valid. Ask Nathan for your personal dashboard link.");
} else {
  load(true);
  setInterval(() => { if (!dash.classList.contains("hidden")) load(); }, 30000);
}
</script></body></html>
